
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Caseiros Top</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Caseiros Top</h1>
    <h2>Cadastro de Pedidos</h2>

    <p>
        <a href="{{ url_for('main.home') }}">Voltar ao início</a>
    </p>

    {% with mensagens = get_flashed_messages() %}
        {% for mensagem in mensagens %}
            <p>{{ mensagem }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <h2>Novo pedido</h2>

        <p>
            <label for="nome_cliente">Nome do cliente (opcional):</label><br>
            <input
                type="text"
                id="nome_cliente"
                name="nome_cliente"
                maxlength="100"
                placeholder="Digite o nome do cliente"
            >
        </p>

        <p>
            <label for="produto_id">Produto:</label><br>
            <select id="produto_id" name="produto_id" required>
                <option value="">Selecione um produto</option>

                {% for produto in produtos %}
                    <option value="{{ produto.id }}">
                        {{ produto.nome }} - R$ {{ "%.2f"|format(produto.preco) }}
                    </option>
                {% endfor %}

            </select>
        </p>

        <p>
            <label for="quantidade">Quantidade:</label><br>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                step="1"
                placeholder="Ex.: 2"
                required
            >
        </p>

        <button type="submit">Cadastrar pedido</button>

    </form>

</body>
</html>
