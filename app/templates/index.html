
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseiros Top</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Caseiros Top</h1>
    <h2>Sistema de Gestão e Organização da Pastelaria</h2>

    <p>Bem-vindo ao sistema!</p>
    <p>Organizando pedidos, estoque e financeiro em um só lugar.</p>

    <h2>Menu principal</h2>

    <p>
        <a href="{{ url_for('main.produtos') }}">Cadastro de Produtos</a>
    </p>

    <p>
        <a href="{{ url_for('main.pedidos') }}">Cadastro de Pedidos</a>
    </p>

    <p>
        <a href="{{ url_for('main.consultar_pedidos') }}">Consultar Pedidos</a>
    </p>

    <p>
        <a href="{{ url_for('main.estoque') }}">Controle de Estoque</a>
    </p>

    <p>
        <a href="{{ url_for('main.financeiro') }}">Controle Financeiro</a>
    </p>

    <h2>Acessibilidade</h2>

    <button
        type="button"
        id="botao-contraste"
        aria-pressed="false"
    >
        Ativar alto contraste
    </button>

    <script>
        const botaoContraste = document.getElementById("botao-contraste");

        botaoContraste.addEventListener("click", function () {
            const ativado = document.body.classList.toggle("alto-contraste");

            botaoContraste.setAttribute("aria-pressed", ativado);

            botaoContraste.textContent = ativado
                ? "Desativar alto contraste"
                : "Ativar alto contraste";
        });
    </script>

</body>
</html>
